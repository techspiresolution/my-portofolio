 <style>
    .container {
      position: relative;
      display: inline-block;
    }

    .hover-text {
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s, opacity 0.3s ease-in-out;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 5px 10px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .container:hover .hover-text {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <button>Hover me</button>
    <div class="hover-text">This is the hidden text!</div>
  </div>
</body>
</html>
